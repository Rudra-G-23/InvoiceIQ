[project]
name = "invoiceiq"
version = "0.0.1"
description = "Local, explainable invoice-to-PO validation workflow"
readme = "README.md"
authors = [
    { name = "Rudra Prasad Bhuyan", email = "rudraprasadbhuyan999@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<12",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.26,<2",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.4,<5",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.12,<1"]

[tool.ruff.lint]
ignore = ["B008"]

[project.scripts]
invoiceiq = "invoiceiq.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
